[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citecheck"
version = "0.1.0"
description = "Check that the file:line citations and quoted snippets in an AI agent's report match the code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
citecheck = "citecheck.cli:main"

[tool.setuptools]
packages = ["citecheck"]
